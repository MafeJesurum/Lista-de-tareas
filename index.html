<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas CUC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-container">

    <header class="app-header">
      <p class="app-eyebrow">Buenas Prácticas · Demo de despliegue</p>
      <h1 class="app-title">Lista de Tareas CUC</h1>
      <p class="app-subtitle">Tablero estilo Trello</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        id="taskInput"
        class="task-input"
        type="text"
        placeholder="Escribe una tarea nueva..."
        autocomplete="off"
        required
      />
      <button type="submit" class="btn-primary">Agregar</button>
    </form>

    <div class="board" id="board"></div>

    <footer class="app-footer">
      <p>Hecho para la clase de Buenas Prácticas de Desarrollo de Software · CUC</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
