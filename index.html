<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Tareas — Demo Netlify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-container">

    <header class="app-header">
      <p class="app-eyebrow">Buenas Prácticas · Demo de despliegue</p>
      <h1 class="app-title">Mis Tareas</h1>
      <p class="app-subtitle">Una app pequeña, sin frameworks, lista para desplegar en Netlify.</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        id="taskInput"
        class="task-input"
        type="text"
        placeholder="Escribe una tarea nueva..."
        autocomplete="off"
        required
      />
      <button type="submit" class="btn-primary">Agregar</button>
    </form>

    <section class="task-panel">
      <div class="task-panel-header">
        <h2 class="task-panel-title">Pendientes</h2>
        <span id="taskCounter" class="task-counter">0 tareas</span>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <p id="emptyState" class="empty-state">
        No tienes tareas todavía. Agrega la primera arriba ↑
      </p>
    </section>

    <footer class="app-footer">
      <p>
        Hecho para la clase de Buenas Prácticas de Desarrollo de Software · CUC
      </p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
